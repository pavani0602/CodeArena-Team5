# ============================================================
# CodeArena — Development Profile
# Activate with: --spring.profiles.active=dev
# ============================================================

# ----------------------------------------------------------
# PostgreSQL Datasource (dev)
# ----------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/codearena_dev
spring.datasource.username=postgres
spring.datasource.password=postgres

# ----------------------------------------------------------
# JPA / Hibernate (dev)
# ----------------------------------------------------------
# Use update for convenience during development
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------------------------
# Flyway (dev)
# ----------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.clean-disabled=false

# ----------------------------------------------------------
# JWT (dev — short-lived secret, OK for local work)
# ----------------------------------------------------------
app.jwt.secret=dev-only-secret-key-replace-in-production-base64encoded123456
app.jwt.expiration-ms=86400000

# ----------------------------------------------------------
# Logging (verbose for dev)
# ----------------------------------------------------------
logging.level.com.codearena=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ----------------------------------------------------------
# Swagger always on in dev
# ----------------------------------------------------------
springdoc.swagger-ui.enabled=true
