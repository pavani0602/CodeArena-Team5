# ============================================================
# CodeArena — Application Configuration
# ============================================================

# ----------------------------------------------------------
# Server
# ----------------------------------------------------------
server.port=8080

# ----------------------------------------------------------
# PostgreSQL Datasource
# ----------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/codearena
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ----------------------------------------------------------
# JPA / Hibernate
# ----------------------------------------------------------
# Flyway manages the schema — Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ----------------------------------------------------------
# Flyway
# ----------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ----------------------------------------------------------
# JWT
# ----------------------------------------------------------
app.jwt.secret=CHANGE_ME_TO_A_SECURE_BASE64_ENCODED_SECRET_KEY_AT_LEAST_256_BITS
app.jwt.expiration-ms=86400000

# ----------------------------------------------------------
# Swagger / OpenAPI
# ----------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ----------------------------------------------------------
# Logging
# ----------------------------------------------------------
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
