version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: codearena_db
    environment:
      POSTGRES_DB: codearena_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hemanth
    ports:
      - "5432:5432"
    volumes:
      - codearena_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  codearena_data:
