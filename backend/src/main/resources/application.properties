spring.application.name=codearena-backend

# Database Configuration — Using local H2 file database (PostgreSQL compatibility mode) so no external DB/Docker is needed!
# To use external PostgreSQL instead, uncomment the PostgreSQL lines and comment out the H2 lines below.
# spring.datasource.url=jdbc:postgresql://localhost:5432/codearena_db
# spring.datasource.username=postgres
# spring.datasource.password=hemanth
# spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:h2:file:./data/codearena_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate — let Flyway manage schema, Hibernate only validates
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Repair checksums if migration script changed after first run
spring.flyway.repair-on-migrate=true

# JWT Secret
app.jwt.secret=codearena_secret_key_for_jwt_token_generation_2026_secure_key

# Server
server.port=8080

# Logging
logging.level.com.codearena=DEBUG